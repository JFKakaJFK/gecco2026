[project]
name = "paper_stuff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.2",
    "experiment-shared",
    "matplotlib>=3.5.3",
    "numpy>=1.21.6",
    "pandas>=1.1.5",
    "pmlb@git+https://github.com/EpistasisLab/pmlb.git@master",
    "scikit-learn>=1.0.2",
    "seaborn>=0.12.2",
    "sympy>=1.10.1",
    "tqdm>=4.67.1",
    "ucimlrepo>=0.0.3",
]

[tool.uv.sources]
experiment-shared = { path = "../shared", editable = true }
pygom = { path = "../../../" }

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
[project]
name = "experiment-shared"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.6",
    "pmlb@git+https://github.com/EpistasisLab/pmlb.git@master",
    "scikit-learn>=1.0.2",
    "sympy>=1.10.1",
    "ucimlrepo",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper_experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3.2",
    "jax[cuda13]",
    "jaxtyping",
    "kozax>=0.0.4",
    "matplotlib>=3.5.3",
    "numpy>=1.21.6",
    "pandas>=1.1.5",
    "pmlb@git+https://github.com/EpistasisLab/pmlb.git@master",
    "pygom",
    "pyyaml>=6.0.1",
    "rliable>=1.2.0",
    "scikit-learn>=1.0.2",
    "scipy>=1.7.3",
    "seaborn>=0.12.2",
    "sympy>=1.10.1",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
pygom = { path = "../../../" }

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]